name: FIB source monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-monitor.yml'
      - 'config/source-monitor.json'
      - 'tools/source-monitor/**'
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: fib-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run source monitor
        run: |
          python3 tools/source-monitor/source_monitor.py

      - name: Upload fetched documents and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fib-source-monitor-${{ github.run_number }}
          path: source-monitor-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist monitor state and inbox
        if: success()
        run: |
          if git diff --quiet -- data/source-monitor-state.json data/source-monitor-inbox.json; then
            echo "No monitor-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-monitor-state.json data/source-monitor-inbox.json
          git commit -m "Update FIB source monitor state"
          git push
