<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presseschau Feldkirchen</title>
</head>
<body>
<noscript>Für diesen Demonstrator muss JavaScript aktiviert sein.</noscript>
<p id="status" style="font-family:system-ui,sans-serif;padding:1rem">Presseschau wird geladen …</p>
<script>
(async()=>{
  try {
    const files=[
      'release-2026-08-29/p1.txt',
      'release-2026-08-29/p2.txt',
      'release-2026-08-29/p3.txt',
      'release-2026-08-29/p4.txt'
    ];
    let encoded='';
    for(const file of files){
      const response=await fetch(file,{cache:'no-store'});
      if(!response.ok) throw new Error(file+' – HTTP '+response.status);
      encoded+=await response.text();
    }
    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.body.innerHTML='<p style="font-family:system-ui,sans-serif;padding:1rem"><strong>Die Presseschau konnte nicht geladen werden.</strong><br>Technischer Hinweis: '+String(e.message||e)+'</p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
